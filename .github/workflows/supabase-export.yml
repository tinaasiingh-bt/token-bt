name: Export Supabase tokens

# Run from Actions -> "Export Supabase tokens" -> Run workflow.
# Generates the Tokens Studio export from the Supabase token tables (scripts/supabase_export.py
# + rules/supabase-export-rules.json), writes it to incoming/supabase/ on the incoming/supabase
# branch (overwritten every run), then runs "Clean Supabase token export" on that branch so the
# usual review PR is opened or updated. Nothing reaches tokens/ until that PR is merged.
#
# Source is the Supabase staging project: token data is edited there and promoted to prod from
# there, so it is the source of truth. The key is the publishable (anon) key; the token tables
# grant it SELECT only.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: supabase-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate the export from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 -I scripts/supabase_export.py --source staging --out incoming/supabase

      - name: Push incoming/supabase (replaced every run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B incoming/supabase
          git add -f incoming/supabase
          # The notes file carries a timestamp, so there is always something to commit and a review PR is always opened.
          git commit -m "incoming: Supabase export $(date -u +%F)"
          git push --force origin incoming/supabase

      - name: Run the cleaner on that branch
        # A push made with GITHUB_TOKEN does not fire other workflows' on:push, so dispatch it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run supabase-import.yml --ref incoming/supabase -f file=incoming/supabase
